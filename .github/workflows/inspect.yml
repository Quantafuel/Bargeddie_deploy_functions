name: Inspect Function Secret
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Repository or environment secret name (exact). Example: EXTRA_SECRETS_Skive_drain_data'
        required: true
        default: 'EXTRA_SECRETS_Skive_drain_data'

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: prod   # keep if secret is an environment secret (change/remove as needed)
    steps:
      - name: Check secret exists
        id: check
        run: |
          if [ -z "${{ secrets[github.event.inputs.secret_name] }}" ]; then
            echo "secret_missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "secret_missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and show safe fingerprint of client_id
        if: steps.check.outputs.secret_missing == 'false'
        env:
          SECRET_VALUE: ${{ secrets[github.event.inputs.secret_name] }}
        run: |
          set -euo pipefail

          # Decode base64 safely (don't print the decoded value)
          decoded=$(printf '%s' "$SECRET_VALUE" | base64 --decode 2>/dev/null || true)

          if [ -z "$decoded" ]; then
            echo "Failed to decode secret or decoded value is empty"
            exit 1
          fi

          # Extract client_id (assumes format CLIENT_ID:CLIENT_SECRET)
          client_id="${decoded%%:*}"

          if [ -z "$client_id" ]; then
            echo "No client_id found (expected 'CLIENT_ID:CLIENT_SECRET' after base64 decode)"
            exit 1
          fi

          # Compute SHA-256 hash (hex) of client_id and print first 8 hex chars and length
          if command -v sha256sum >/dev/null 2>&1; then
            hash_full=$(printf '%s' "$client_id" | sha256sum | awk '{print $1}')
          else
            hash_full=$(printf '%s' "$client_id" | openssl dgst -sha256 -r | awk '{print $1}')
          fi
          hash_prefix=${hash_full:0:8}
          len=${#client_id}

          echo "Client ID fingerprint (sha256 prefix): $hash_prefix"
          echo "Client ID length (chars): $len"

      - name: Secret not found
        if: steps.check.outputs.secret_missing == 'true'
        run: |
          echo "Secret '${{ github.event.inputs.secret_name }}' not found in repository or environment secrets."
